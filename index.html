<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Web Player: Music for everyone </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main">

        <div class="sidebar">
            <div class="nav">
                <div class="nav_option" style="opacity: 1;">
                    <i class="fa-solid fa-house"></i>
                    <a href="#">Home</a>
                </div>
                <div class="nav_option">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <a href="#">Search</a>
                </div>
            </div>
            <div class="library" >
                 <div class="option">
                    <div class="libraryoption nav_option" >
                    <img src="library_icon.png" alt="">
                    <a href="#">Your library</a>
                </div>
                <div class="icons">
                    <i class="fa-solid fa-plus"></i>
                    <i class="fa-solid fa-arrow-right"></i>
                </div>
                 </div>
                 <div class="libbox">
                    <div class="box">
                        <div class="boxp1">Create your first playlist</div>
                        <div class="boxp2">It's easy we'll help you</div>
                        <button class="badge">Create playlist</button>
                    </div>
                 </div>
                 <div class="libbox">
                    <div class="box">
                        <div class="boxp1">Let's find some podcasts to follow</div>
                        <div class="boxp2">We'll help you discover new favorites</div>
                        <button class="badge">Browse prodcast</button>
                    </div>
                 </div>
            </div>

        </div>
        <div class="maincontent">
            <div class="stickynav">
                <div class="navicons">
                    <img src="backward_icon.png" alt="">
                    <img src="forward_icon.png" alt="">
                </div>
                <div class="navoptions">
                    <button class="badge item">Explore Premium</button>
                    <button class="badge item darkbadge"><i class="fa-regular fa-circle-down" style="margin-right: 5px;"></i>Install App</button>
                    <i class="fa-regular fa-user item" ></i>
                </div>
            </div>
            <div class="cards"></div>
        </div>
        <div class="musicplayer">music player</div>
    </div>
</body>
</html>
